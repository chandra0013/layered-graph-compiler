[project]
name = "layered-graph-compiler"
version = "0.1.0"
description = "Deterministic layered graph compiler and retrieval system for codebases."
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "chandra0013", email = "mandlachandrakiran@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "networkx>=3.6.1",
    "pydantic>=2.13.3",
    "pytest>=9.0.3",
    "rich>=15.0.0",
    "ruff>=0.15.12",
    "tiktoken>=0.12.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "typer>=0.24.2",
]

[project.scripts]
lgc = "lgc.cli:app"
layered-graph-compiler = "lgc.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lgc"
